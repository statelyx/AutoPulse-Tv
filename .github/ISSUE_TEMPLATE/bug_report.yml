name: Bug report
description: Report a reproducible application problem
title: "[Bug]: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include a reproducible public sample if applicable; omit private URLs and tokens.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App commit, OS and device
      placeholder: "Commit / iOS version / iPhone or receiver model"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Library and imports
        - Native player
        - Phone browser
        - AirPlay receiver
        - Optional CarPlay build
        - Build or signing
        - Other
    validations:
      required: true
