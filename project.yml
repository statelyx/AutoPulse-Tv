name: AutoPulseTV
options:
  bundleIdPrefix: com.statelyxx
  deploymentTarget:
    iOS: '17.0'
targets:
  AutoPulseTV:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: build/AutoPulseTV-Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.statelyxx.autopulsetv
        MARKETING_VERSION: '1.1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: AutoPulse TV
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  AutoPulseTVTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AutoPulseTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AutoPulseTVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AutoPulseTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AutoPulseTV:
    build:
      targets:
        AutoPulseTV: all
    test:
      targets:
        - AutoPulseTVTests
        - AutoPulseTVUITests
