name: Molaqo
options:
  bundleIdPrefix: com.statelyxx
  deploymentTarget:
    iOS: '17.0'
targets:
  Molaqo:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.statelyxx.molaqo
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Molaqo TV
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  MolaqoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Molaqo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MolaqoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Molaqo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Molaqo:
    build:
      targets:
        Molaqo: all
    test:
      targets:
        - MolaqoTests
        - MolaqoUITests
