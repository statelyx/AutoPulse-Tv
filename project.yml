name: AutoPulseTV
options:
  bundleIdPrefix: com.statelyxx
  deploymentTarget:
    iOS: '17.0'
targets:
  AutoPulseTV:
    type: application
    platform: iOS
    sources:
      - Sources
      - CarPlay
      - Resources
    entitlements:
      path: CarPlay/AutoPulseTV.entitlements
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: AutoPulse TV
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: AutoPulseTV CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.statelyxx.autopulsetv
        MARKETING_VERSION: '1.1.0'
        CURRENT_PROJECT_VERSION: '5'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1,2'
  AutoPulseTVTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AutoPulseTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AutoPulseTV.app/AutoPulseTV
        BUNDLE_LOADER: $(TEST_HOST)
  AutoPulseTVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AutoPulseTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AutoPulseTV:
    build:
      targets:
        AutoPulseTV: all
    test:
      targets:
        - AutoPulseTVTests
        - AutoPulseTVUITests
