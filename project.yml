name: ParkPlay
options:
  bundleIdPrefix: com.statelyx
  deploymentTarget:
    iOS: '17.0'
targets:
  ParkPlay:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.statelyx.parkplay
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ParkPlay
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  ParkPlayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ParkPlay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ParkPlayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ParkPlay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ParkPlay:
    build:
      targets:
        ParkPlay: all
    test:
      targets:
        - ParkPlayTests
        - ParkPlayUITests
